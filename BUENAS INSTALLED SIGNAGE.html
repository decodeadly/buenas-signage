// ---- input
const ptrs=new Map();let moved=0,lastD=0;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,[e.clientX,e.clientY]);moved=0;cv.classList.add('drag');cancelAnimationFrame(anim);lastD=0});
cv.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;const o=ptrs.get(e.pointerId);ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  if(ptrs.size===1){const dx=e.clientX-o[0],dy=e.clientY-o[1];moved+=Math.abs(dx)+Math.abs(dy);cx-=dx/ppd;cy+=dy/ppd;draw()}
  else if(ptrs.size===2){const [a,b]=[...ptrs.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);const r=wrap.getBoundingClientRect();if(lastD)zoomAt(d/lastD,(a[0]+b[0])/2-r.left,(a[1]+b[1])/2-r.top);lastD=d;moved=99}});
const up=e=>{ptrs.delete(e.pointerId);lastD=0;if(!ptrs.size)cv.classList.remove('drag');if(e.type==='pointerup'&&moved<6&&sel){sel=null;card.hidden=true;draw();markList()}};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',e=>{e.preventDefault();const r=wrap.getBoundingClientRect();zoomAt(Math.exp(-e.deltaY*.0016),e.clientX-r.left,e.clientY-r.top)},{passive:false});
cv.addEventListener('dblclick',e=>{const r=wrap.getBoundingClientRect();zoomAt(2,e.clientX-r.left,e.clientY-r.top)});
$('zin').onclick=()=>zoomAt(1.6,W/2,H/2);$('zout').onclick=()=>zoomAt(1/1.6,W/2,H/2);$('zfit').onclick=()=>fit(visible,60);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sel){sel=null;card.hidden=true;draw();markList()}});
// ---- list & filters
const cats=[...new Set(pins.map(p=>p.cat).filter(Boolean))].sort();const cs=$('cat');
cs.add(new Option('All categories ('+pins.length+')',''));cats.forEach(c=>cs.add(new Option(c+' ('+pins.filter(p=>p.cat===c).length+')',c)));
function apply(refit){const q=$('q').value.trim().toLowerCase(),c=cs.value;
  visible=pins.filter(p=>(!c||p.cat===c)&&(!q||[p.name,p.loc,p.owner,p.addr,p.cat].join(' ').toLowerCase().includes(q)));
  visible.sort((a,b)=>(a.lat==null)-(b.lat==null)||a.name.localeCompare(b.name));
  $('count').textContent=`Showing ${visible.length} of ${pins.length} · ${visible.filter(p=>p.lat!=null).length} on map`;
  const list=$('list');list.textContent='';
  for(const p of visible){const b=el('button','item');b.dataset.i=p.i;const n=el('div','n');n.appendChild(el('span',null,p.name||'(no name)'));if(p.lat==null)n.appendChild(el('span','tag','No pin'));
    b.appendChild(n);b.appendChild(el('div','m',[p.loc,p.cat].filter(Boolean).join(' · ')));b.onclick=()=>select(p,true);list.appendChild(b)}
  markList();if(refit)fit(visible,60);else draw()}
function markList(){document.querySelectorAll('.item').forEach(b=>b.setAttribute('aria-current',sel&&+b.dataset.i===sel.i?'true':'false'))}
$('q').addEventListener('input',()=>apply(true));cs.addEventListener('change',()=>apply(true));$('tBounds').onchange=draw;
$('sTotal').textContent=pins.length;$('sPinned').textContent=pins.filter(p=>p.lat!=null).length;$('sMiss').textContent=pins.filter(p=>p.lat==null).length;
// ---- boot
readColors();matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{readColors();draw()});
new MutationObserver(()=>{readColors();draw()}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
new ResizeObserver(resize).observe(wrap);
resize();apply(false);fit(pins,60);
})();
</script>

</body></html>
